name: Update market prices

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
  schedule:
    # 08:30–16:15 India time, Monday to Friday (UTC is 5 h 30 min behind).
    - cron: '*/15 3-10 * * 1-5'
    # Capture a final weekday snapshot at approximately 17:00 India time.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out price feed
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch sheet prices and update snapshots
        run: node scripts/update-prices.mjs

      - name: Save updated price feed
        run: |
          if git diff --quiet -- data/latest.json data/history.json; then
            echo "No price changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git commit -m "Update market price feed"
          git push

